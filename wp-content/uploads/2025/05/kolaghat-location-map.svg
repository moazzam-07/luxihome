<svg xmlns="http://www.w3.org/2000/svg" width="211" height="150" viewBox="0 0 211 150" fill="none">
  <!-- Pill Background -->
  <rect width="211" height="150" rx="75" fill="white" fill-opacity="0.08"/>
  <rect x="0.5" y="0.5" width="210" height="149" rx="74.5" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Subtle Geographic Grid Backdrop (Left Half) -->
  <circle cx="68" cy="75" r="48" stroke="white" stroke-opacity="0.08" stroke-dasharray="2 2" stroke-width="0.5"/>
  <circle cx="68" cy="75" r="32" stroke="white" stroke-opacity="0.06" stroke-width="0.5"/>

  <!-- Compass North Indicator -->
  <g transform="translate(32, 28)" opacity="0.65">
    <path d="M0 -6 L2.5 2 L0 0 L-2.5 2 Z" fill="#BE7F64"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="5" fill="white" font-weight="600" letter-spacing="0.5">N</text>
  </g>

  <!-- Rupnarayan River Flow (Terracotta Luxury Tone) -->
  <!-- River Body -->
  <path d="M42 20 C52 38, 70 48, 74 62 C78 76, 68 88, 64 98 C60 108, 68 122, 78 132 C82 136, 86 138, 92 140 L84 142 C76 140, 72 135, 68 130 C58 118, 50 104, 54 94 C58 84, 68 74, 64 62 C60 50, 44 40, 34 20 Z" fill="#BE7F64" fill-opacity="0.32"/>
  
  <!-- Main River Flow Channel -->
  <path d="M38 20 C48 39, 67 49, 71 62 C75 75, 65 86, 61 96 C57 106, 65 120, 75 131 C80 136, 85 139, 90 141" stroke="#BE7F64" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- River Bank Accent Lines -->
  <path d="M44 22 C53 41, 72 50, 76 63 C80 77, 70 89, 66 99 C62 109, 70 123, 80 133" stroke="#BE7F64" stroke-opacity="0.5" stroke-width="0.6" stroke-dasharray="3 1.5"/>
  <path d="M32 20 C42 37, 61 47, 65 60 C69 73, 59 84, 55 94 C51 104, 59 118, 69 129" stroke="#BE7F64" stroke-opacity="0.4" stroke-width="0.5"/>

  <!-- NH16 High-Speed Highway Corridor & Bridge -->
  <path d="M22 88 C40 82, 60 76, 82 70 C100 65, 116 62, 128 60" stroke="white" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3.5 2"/>
  <g transform="translate(68, 74) rotate(-16)">
    <!-- Bridge Piers / Span Indicator -->
    <line x1="-3" y1="-2" x2="-3" y2="2" stroke="white" stroke-width="1" stroke-opacity="0.8"/>
    <line x1="3" y1="-2" x2="3" y2="2" stroke="white" stroke-width="1" stroke-opacity="0.8"/>
  </g>

  <!-- View-Cone towards River & Landscape -->
  <path d="M84 52 L54 36 M84 52 L52 74" stroke="white" stroke-width="0.6" stroke-dasharray="2.5 1.5" stroke-opacity="0.45"/>
  <path d="M58 40 C54 48, 54 62, 57 68" stroke="white" stroke-width="0.5" stroke-dasharray="1.5 1.5" stroke-opacity="0.35"/>

  <!-- Naguria Estate Location Pinpoint -->
  <g transform="translate(84, 52)">
    <!-- Outer Pulsing Halo -->
    <circle cx="0" cy="0" r="9" fill="#BE7F64" fill-opacity="0.22"/>
    <circle cx="0" cy="0" r="5.5" stroke="#BE7F64" stroke-width="0.8" stroke-opacity="0.85"/>
    <circle cx="0" cy="0" r="3.2" fill="#BE7F64"/>
    <circle cx="0" cy="0" r="1.6" fill="white"/>
    <!-- Connection Pin Stem -->
    <line x1="0" y1="5.5" x2="0" y2="9" stroke="white" stroke-width="0.8" stroke-opacity="0.75"/>
  </g>

  <!-- Right Half: Concentric Luxury Framing Arcs -->
  <path d="M136 136 C170 136, 198 108, 198 75 C198 42, 170 14, 136 14" stroke="white" stroke-width="0.5" stroke-opacity="0.38"/>
  <path d="M136 139 C172 139, 201 110, 201 75 C201 40, 172 11, 136 11" stroke="white" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Right Half: Editorial Typography -->
  <g text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Subtitle / Region -->
    <text x="135" y="58" font-size="5.5" font-weight="600" fill="#BE7F64" letter-spacing="1.2">KOLAGHAT</text>
    
    <!-- Estate Title -->
    <text x="135" y="70" font-size="7.5" font-weight="700" fill="white" letter-spacing="1.2">NAGURIA</text>
    <text x="135" y="80" font-size="6.5" font-weight="500" fill="white" letter-spacing="1">ESTATE</text>
    
    <!-- Feature / Setting Line -->
    <line x1="135" y1="86" x2="182" y2="86" stroke="white" stroke-opacity="0.2" stroke-width="0.5"/>
    
    <text x="135" y="95" font-size="5" font-weight="400" fill="white" fill-opacity="0.8" letter-spacing="0.8">RIVER BREEZE</text>
    <text x="135" y="103" font-size="4.5" font-weight="300" fill="white" fill-opacity="0.6" letter-spacing="0.8">PIN • 721130</text>
  </g>
</svg>
